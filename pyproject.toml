[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thread-archive"
version = "0.1.0"
description = "Serverless-native local archive for AI conversations: JSONL truth log + rebuildable SQLite index, searched and read locally, exposed over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ella" }]
keywords = ["archive", "conversations", "sqlite", "jsonl", "mcp", "serverless"]

# One storage/runtime path: JSONL + SQLite. No server backends behind extras.
# (Non-Negotiable #1.) numpy/networkx are for the optional vector + knowledge
# layers but are light enough to keep in the base; embeddings (torch) is the
# only genuinely heavy, genuinely optional piece.
dependencies = [
    "sqlalchemy>=2.0",
    "numpy>=1.26",
    "networkx>=3.2",
    "scipy>=1.11",  # networkx pagerank backend (the topic graph)
    "leidenalg>=0.10",  # Leiden community detection (well-connected communities)
    "python-igraph>=0.11",  # leidenalg's graph backend
    "mcp>=1.0",
]

[project.optional-dependencies]
# Local semantic search (nomic-embed-text-v1.5 via sentence-transformers). Heavy
# (pulls torch); the base install is lexical-only. einops is needed by nomic's
# trust_remote_code model.
embeddings = ["sentence-transformers>=3.0", "einops>=0.7"]
dev = ["pytest>=8.0"]

[project.scripts]
archive = "thread_archive.cli:main"
archive-mcp = "thread_archive.mcp.server:main"
archive-librarian-mcp = "thread_archive.mcp.librarian:main"

[tool.hatch.build.targets.wheel]
# thread_import is vendored as a sibling package (a zero-dependency clean island)
# so the archive owns its provider parsers with no external dependency.
# See src/thread_import/.
packages = ["src/thread_archive", "src/thread_import"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
