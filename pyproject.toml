[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thread-archive"
dynamic = ["version"]
description = "Serverless-native local archive for AI conversations: JSONL truth log + rebuildable SQLite index, searched and read locally, exposed over MCP."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ella" }]
keywords = ["archive", "conversations", "sqlite", "jsonl", "mcp", "serverless"]
# No License classifier: the SPDX `license` expression above is the PEP 639
# source of truth, and backends reject mixing the two.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Utilities",
]

# One storage/runtime path: JSONL + SQLite. No server backends behind extras.
# (Non-Negotiable #1.) numpy is for the optional vector layer but light enough to
# keep in the base; networkx is the kNN graph container and the seeded Louvain
# engine for _retrieval/community.py, the shared community spine.
#
# What is deliberately NOT here is the Leiden engine. The base install still has
# compiled dependencies (numpy, and pydantic-core/cryptography under mcp), but
# those publish wheels across musl, aarch64, and glibc back to 2.17. leidenalg +
# igraph are the narrow ones — no musllinux-aarch64 wheel at all, and a
# manylinux floor of 2.28 — so they are the only deps that turn `pip install
# thread-archive` into a source build needing a C toolchain. Behind an extra, that
# platform tax is paid by installs that asked for the feature.
dependencies = [
    "sqlalchemy>=2.0",
    "numpy>=1.26",
    "networkx>=3.2",  # kNN graph container + the seeded Louvain engine
    # <2: the server is written against the 1.x FastMCP API; mcp 2.0 removes
    # mcp.server.fastmcp, so an unpinned resolve breaks archive-mcp at import.
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
# Leiden community detection — C extensions, and the only ones the archive uses.
# They partition the corpus-native embedding graph (_retrieval/embed_graph.py)
# that the coherence re-rank reads. Optional because that graph is built from the
# vector pack: a lexical-only install never builds it and never calls the engine.
# `embeddings` therefore pulls this in — semantic search is exactly the condition
# under which the engine has work to do, and Louvain ranks below the archive's
# gated recall floor. A consumer that partitions a graph of its own (the librarian's
# topic graph, which needs no vectors) depends on `thread-archive[leiden]` directly.
#
# `igraph`, not the `python-igraph` alias: the alias is an empty shim that only
# depends on `igraph`, and the code imports `igraph`. Declaring what is imported
# is what lets the dependency-tier ratchet resolve the name without the package
# installed — through the alias it can't, and an install without the extra reads
# the guarded `import igraph` as undeclared.
leiden = ["leidenalg>=0.10", "igraph>=0.11"]
# Local semantic search (nomic-embed-text-v1.5 via sentence-transformers). Heavy;
# the base install is lexical-only. einops is needed by nomic's trust_remote_code
# model. torch is declared rather than left to arrive under sentence-transformers:
# embed.py imports it directly to pick the device and the fp16 dtype.
embeddings = [
    "sentence-transformers>=3.0", "einops>=0.7", "torch>=2.0",
    "thread-archive[leiden]",
]
# Every runtime feature in one name, for an install that wants the whole product
# rather than a considered subset. Runtime only — `dev` and `testing` are bench
# and plugin-author tooling, not features, so they stay out.
all = ["thread-archive[embeddings]", "thread-archive[leiden]"]
# pyarrow: search_lab/haystack_eval.py reads the BEAM parquet shards. Bench-only —
# no product code imports it.
# hypothesis: generated queries against the never-raise contract (tests/test_search_fuzz.py).
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-xdist>=3.6", "pytest-timeout>=2.3", "ruff>=0.6", "mypy>=1.11", "build>=1.2", "pyarrow>=17.0", "hypothesis>=6.100"]
# What a provider plugin needs to test itself against the archive: the golden
# harness and isolated-home fixture in thread_archive.provider.testing.
testing = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/ellamental/thread_archive"
Repository = "https://github.com/ellamental/thread_archive"
Changelog = "https://github.com/ellamental/thread_archive/blob/main/CHANGELOG.md"
Issues = "https://github.com/ellamental/thread_archive/issues"

[project.scripts]
# The single front door — setup wizard AND every operator verb, one namespaced
# command. `thread-archive setup` runs first-run discovery/import/wiring; the
# other verbs (watch, status, backup, index verify, service, …) are the
# operator seam that launchd/cron/scripts drive.
#
# `thread-archive` is the command: it matches the distribution name, the MCP
# server name, and the shell convention every other CLI on the box follows. The
# underscore spelling stays installed as an alias — service units, shell history
# and scripts written against it keep working — but nothing documents it, and
# newly written units resolve the hyphen (`_service.spec.entry_path`).
thread-archive = "thread_archive.cli:main"
thread_archive = "thread_archive.cli:main"
# The MCP server keeps its own console script — it's what MCP clients point at.
archive-mcp = "thread_archive._mcp.server:main"

# Provider plugins publish under this group; archive reads it at registry load.
# Declared here so the name is documented in the project that consumes it —
# archive itself registers no providers this way, since its own are built in.
[project.entry-points."thread_archive.providers"]

[tool.hatch.version]
path = "src/thread_archive/__init__.py"

[tool.hatch.build.targets.wheel]
# Provider parsers live in thread_archive._thread_import — a vendored,
# zero-dependency clean island, kept private (no public top-level package)
# until its API is deliberately exposed.
packages = ["src/thread_archive"]
# The dev-only viewer surfaces (the /retrieval report page) read the search lab,
# which is a source-tree directory and not part of an install. Excluding them
# keeps that dependency out of the wheel entirely: the shipped server imports
# _dev fail-softly and answers 404 for the pages it backs.
exclude = ["src/thread_archive/_dev"]
# The web viewer ships pre-built: frontend/ (node, dev-only) builds into
# _web/static/, which is committed and packaged so `pip install` needs no node.
# Under the package dir and tracked, so hatchling includes it by default; declared
# explicitly so the bundle ships even if static/ is ever gitignored as build output.
artifacts = ["src/thread_archive/_web/static/**/*"]

[tool.hatch.build.targets.sdist]
# Ship the package sources, tests, docs, and the frontend sources that build
# the committed _web/static bundle. Everything else (host/, ci.toml, dev
# scripts, node_modules — hatchling only reads the ROOT .gitignore, so nested
# ignore files like frontend/.gitignore do NOT keep node_modules out) stays
# local.
only-include = [
    "src",
    "tests",
    "docs",
    "frontend",
    "scripts",
    "search_lab",
    "CHANGELOG.md",
    ".mcp.json.example",
]
exclude = [
    "frontend/node_modules",
    "frontend/dist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run is every lane except `package` (wheel/sdist build + clean-venv
# install), `beir` (downloads a public IR benchmark, ingests thousands of docs,
# loads torch — tens of minutes), and `quality_models` (the synthetic quality
# corpus under the real model arms — minutes of torch loads) — all
# minutes-to-tens-of-minutes, not seconds. Run them with `-m package` /
# `-m beir` / `-m quality_models`; `package` has a ci.toml row, the other two
# are invoke-by-hand lanes (no CI row) — calibration, not gates.
#
# The search-quality release gate is not a lane here at all. Its subject is this
# box's recorded bench history, and the suite is sandboxed off every machine
# location by design — conftest redirects $HOME and drops the XDG vars, which is
# what makes the lab's state root resolve into a tmpdir here exactly as the
# archive home does. That is the isolation working, not a gap to route around, so
# the gate runs as a command (`python -m search_lab gate`) from the release
# preflight — the same shape as ci.toml's `retrieval-gate` row, for the same
# reason. What *is* pinned here is the baseline's integrity —
# tests/test_search_gate.py, every pass — because an orphaned baseline row
# silently gates nothing.
#
# No `-q` here, deliberately: pytest's verbosity is cumulative, so an addopts
# `-q` plus the `-q` every caller habitually types (docs/install.md's own line, the
# ci.toml rows) lands at -qq — which drops the `N passed in Xs` counts line
# entirely. A green run then prints dots and nothing else, and the standard
# `pytest … | grep -E 'passed|failed'` check comes back empty, indistinguishable
# from a command that never ran. Callers own their own quiet. tests/meta/
# test_output_summary.py holds the line.
#
# `-n auto` IS the default, deliberately: a bare `pytest` is what a contributor —
# and every agent working in this repo — actually types, and serially this suite
# is ~90s of near-uniform 25ms tests with no slow tail to carve off. Parallel it
# is ~30s. `auto` rather than a number because the right width is the machine's,
# not this file's (the ci.toml row pins its own count for its own reasons). It
# pays off on a single file too — the import cost is what dominates a short run.
# `--dist=loadfile` is load-bearing, not a tuning knob: isolation here is per-test,
# but a file's tests still share the module-level fixtures they were written
# against, so they must land on one worker. Escape hatch for interactive work:
# `-n 0` restores a single in-process run (xdist swallows `--pdb` and `-s`).
addopts = "--strict-markers -n auto --dist=loadfile -m 'not package and not beir and not quality_models'"
markers = [
    "integration: opens real sockets or spawns real subprocesses; deselect (-m 'not integration') for a fully hermetic run, e.g. in a no-network sandbox",
    "systemd: installs real systemd --user units and drives `systemctl --user`; gated behind THREAD_ARCHIVE_SYSTEMD_IT=1 (set in the CI `systemd` job) so it never runs — or clobbers a real setup — unless explicitly requested. Needs a live user systemd (a Linux box/VM, not the slim container).",
    "package: builds the wheel/sdist and installs into a throwaway venv; slow, selected explicitly with -m package",
    "beir: runs the BEIR retrieval-calibration harness (network download + torch + a full ingest); tens of minutes, selected explicitly with -m beir",
    "quality_models: the synthetic search-quality corpus under the real embedding model (fused pipeline); minutes of model loads, selected explicitly with -m quality_models",
]
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
# Hang insurance (pytest-timeout): a test that blocks forever must become a
# named failure, not eat a CI row's whole wall-clock budget and die as an
# opaque timeout with no traceback. 300s is far above any legitimate test —
# including the suite's polling deadlines (≤30s) under thread-ci's background
# priority — so only a true hang trips it. The `package` lane's tests carry
# their own larger per-module override (a clean-venv wheel install charged to
# the first test can be minutes on a loaded box).
timeout = 300

# The lint bar: pycodestyle + pyflakes + import sort, long lines tolerated.
# Gated by the ruff row in ci.toml.
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

# The type gate (the mypy row in ci.toml). It covers the complete package,
# including import parsers, operational scripts, and durability code.
[tool.mypy]
files = ["src/thread_archive"]
ignore_missing_imports = true  # mcp ships no stubs
check_untyped_defs = true  # unannotated bodies still execute in production; inspect them too
