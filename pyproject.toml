[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thread-archive"
dynamic = ["version"]
description = "Serverless-native local archive for AI conversations: JSONL truth log + rebuildable SQLite index, searched and read locally, exposed over MCP."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ella" }]
keywords = ["archive", "conversations", "sqlite", "jsonl", "mcp", "serverless"]
# No License classifier: the SPDX `license` expression above is the PEP 639
# source of truth, and backends reject mixing the two.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Utilities",
]

# One storage/runtime path: JSONL + SQLite. No server backends behind extras.
# (Non-Negotiable #1.) numpy/networkx are for the optional vector + knowledge
# layers but are light enough to keep in the base; embeddings (torch) is the
# only genuinely heavy, genuinely optional piece.
dependencies = [
    "sqlalchemy>=2.0",
    "numpy>=1.26",
    "networkx>=3.2",
    "scipy>=1.11",  # networkx pagerank backend (the topic graph)
    "leidenalg>=0.10",  # Leiden community detection (well-connected communities)
    "python-igraph>=0.11",  # leidenalg's graph backend
    "mcp>=1.0",
    "cryptography>=42",  # AES-GCM for redaction's recovery bundles (_ops/redact.py)
]

[project.optional-dependencies]
# Local semantic search (nomic-embed-text-v1.5 via sentence-transformers). Heavy;
# the base install is lexical-only. einops is needed by nomic's trust_remote_code
# model. torch is declared rather than left to arrive under sentence-transformers:
# embed.py and rerank.py import it directly to pick the device and the fp16 dtype.
embeddings = ["sentence-transformers>=3.0", "einops>=0.7", "torch>=2.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "build>=1.2"]

[project.urls]
Repository = "https://github.com/ellamental/thread_archive"
Changelog = "https://github.com/ellamental/thread_archive/blob/main/CHANGELOG.md"

[project.scripts]
# The human front door: first-run setup wizard, then the status view. Both
# spellings so `pip install thread-archive` and docs that say thread_archive
# land on the same command.
thread_archive = "thread_archive._setup:main"
thread-archive = "thread_archive._setup:main"
# The operator seam (launchd/cron/scripts) + the two MCP servers.
archive = "thread_archive.cli:main"
archive-mcp = "thread_archive._mcp.server:main"
archive-librarian-mcp = "thread_archive._mcp.librarian:main"

[tool.hatch.version]
path = "src/thread_archive/__init__.py"

[tool.hatch.build.targets.wheel]
# Provider parsers live in thread_archive._thread_import — a vendored,
# zero-dependency clean island, kept private (no public top-level package)
# until its API is deliberately exposed.
packages = ["src/thread_archive"]
# The web viewer ships pre-built: frontend/ (node, dev-only) builds into
# _web/static/, which is committed and packaged so `pip install` needs no node.
# Under the package dir and tracked, so hatchling includes it by default; declared
# explicitly so the bundle ships even if static/ is ever gitignored as build output.
artifacts = ["src/thread_archive/_web/static/**/*"]

[tool.hatch.build.targets.sdist]
# Ship the package sources, tests, docs, the frontend sources that build the
# committed _web/static bundle, and the archive-librarian plugin (the tests
# exercise its gate hook, so the sdist must carry it). Everything else (host/,
# ci.toml, dev scripts, node_modules — hatchling only reads the ROOT
# .gitignore, so nested ignore files like frontend/.gitignore do NOT keep
# node_modules out) stays local.
only-include = [
    "src",
    "tests",
    "docs",
    "frontend",
    "plugins",
    "scripts",
    "CHANGELOG.md",
    "claude-install.md",
    ".mcp.json.example",
]
exclude = [
    "frontend/node_modules",
    "frontend/dist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run is every lane except `package` (wheel/sdist build + clean-venv
# install — minutes, not seconds; run it with `-m package` or via its ci.toml row).
addopts = "-q --strict-markers -m 'not package'"
markers = [
    "integration: opens real sockets or spawns real subprocesses; deselect (-m 'not integration') for a fully hermetic run, e.g. in a no-network sandbox",
    "package: builds the wheel/sdist and installs into a throwaway venv; slow, selected explicitly with -m package",
]

# The family lint bar (same shape as the thread monorepo products): pycodestyle +
# pyflakes + import sort, long lines tolerated. Gated by the ruff row in ci.toml.
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

# The type gate (the mypy row in ci.toml). Default mypy strictness over the
# living code; the overrides below are a RATCHET, not a policy — each listed
# module predates the gate and is excluded until someone types it. Shrink the
# list; never grow it.
[tool.mypy]
files = ["src/thread_archive"]
ignore_missing_imports = true  # leidenalg / igraph / mcp ship no stubs

[[tool.mypy.overrides]]
module = [
    "thread_archive._thread_import.*",  # vendored parser island — typing it is its own project
    "thread_archive._scripts.*",        # one-shot operator/migration scripts
    # Delicate durability code; type deliberately, not mechanically. These four
    # carry the code that lived in _truth.jsonl_log before its split; the
    # jsonl_log facade and _truth.locks are typed.
    "thread_archive._truth.layout",
    "thread_archive._truth.drain",
    "thread_archive._truth.maintenance",
    "thread_archive._truth.rebuild",
    "thread_archive._ops.verify",       # same
]
ignore_errors = true
