# The public CI gate on GitHub. Mirrors the documented quality bar (README →
# "confirm green"): ruff + mypy + the pytest suite with its coverage floor,
# plus the frontend typecheck/tests and the wheel/sdist release lane.
#
# Both supported platforms run: Linux carries the interpreter matrix and the
# real-systemd lane, macOS the darwin half of the service/ops surface and its own
# clean-venv install. Standard GitHub-hosted runners — macOS included — are free
# for public repositories, so that second platform costs nothing but wall clock.
#
# The one ci.toml row deliberately absent is retrieval-gate: it scores search
# quality against the maintainer's live archive, which no runner has. It stays
# a local gate (see ci.toml).
#
# The suite is model-free (conftest forces the embed/rerank availability gates
# off), so CI installs only the base deps + the `dev` dependency group — never
# the heavy [embeddings] (torch) extra.
#
# `--group` is PEP 735, which pip gained in 25.1; setup-python pins whatever pip
# shipped with the interpreter build, so every install step upgrades pip first
# rather than trusting the runner image's floor.

name: CI

# dev is where development lands; release/* branches stabilize a cut while dev
# keeps moving; main only moves when a release PR merges (docs/releasing.md),
# so the README badge pins main.
on:
  push:
    branches: [main, dev, "release/**"]
  pull_request:

# Every job only reads the repo; nothing here needs a write-capable token.
permissions:
  contents: read

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Python bar: ruff + mypy + the pytest suite with its coverage floor. Run
  # across the supported series (requires-python >=3.12): the floor catches an
  # accidental newer-language feature, 3.14 is the interpreter this project's
  # own machine runs, and 3.13 sits between so every version the classifiers
  # advertise is a version the suite has actually run on.
  #
  # macOS is a supported target (the classifiers say so), and a pile of code only
  # ever executes there: the launchd service backend, the darwin branches in
  # _ops/machine.py and _ops/nightly.py, the watcher's platform paths. It gets one
  # lane, at the interpreter this project runs — the version axis is a
  # language-level question that the Linux lanes already answer at both ends.
  # mypy on that lane is not a duplicate either: it resolves `sys.platform` to the
  # host it runs on, so the darwin-only code the Linux lanes discard as
  # unreachable is type-checked only here (and the systemd side only there).
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Base + the `dev` group only. The optional thread-librarian package
      # (curation; its own repo) is deliberately NOT installed: nothing in this
      # repo may require it, in CI or anywhere else. The tests that exercise the
      # curated data plane seed through its write surface and importorskip
      # without it; the coverage floors are set to hold on this librarian-free
      # run, so a fork PR needs no secrets and no sibling checkout.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      # Coverage floor feeds the coverage-gate step; the term report keeps blind
      # spots visible in the row output.
      - name: Pytest
        run: >
          pytest -q --tb=short -p no:cacheprovider
          --cov=src --cov-branch
          --cov-report=term --cov-report=json:coverage.json

      - name: Coverage floors
        run: python scripts/coverage_gate.py coverage.json

  # The same suite in one process — the only job that can see cross-file state
  # leaks. Parallel workers make a dirty-global read a coin flip; serial is the
  # worst case made deterministic: every file, one process, in collection
  # order. It is also what `-n auto` resolves to on a one-core box, so a red
  # here is a real failure of a real run. (ci.toml's pytest-serial row is the
  # local twin; this keeps the check alive for trees this box never sweeps.)
  python-serial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Pytest, one process
        run: pytest -q --tb=short -p no:cacheprovider -n 0 --no-cov

  # The Linux service backend, exercised against a REAL user systemd — the one
  # thing the unit suite can't prove (the ubuntu-latest runner is a full VM with
  # systemd as PID1, but the runner user has no user manager until we enable
  # linger). Keeps the systemd port from silently rotting: a refactor that breaks
  # `_service/systemd.py` fails here, not just a manual VM run. The unit-level
  # render + stub tests already run in the `python` job on every platform.
  systemd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      # Bring up the runner user's systemd instance (+ its runtime dir / bus),
      # which `systemctl --user` needs and a fresh non-login runner lacks.
      - name: Bring up the user service manager
        run: |
          sudo loginctl enable-linger "$USER"
          for _ in $(seq 1 30); do
            [ -S "/run/user/$(id -u)/bus" ] && break
            sleep 1
          done
          XDG_RUNTIME_DIR=/run/user/$(id -u) systemctl --user is-system-running || true

      - name: Real systemd lifecycle
        env:
          THREAD_ARCHIVE_SYSTEMD_IT: "1"
        run: |
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          pytest -m systemd -p no:cacheprovider tests/test_systemd_integration.py

  # The web viewer's gates: types, committed-build freshness, and component
  # behavior with coverage floors.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Committed build is current
        run: python3 ../scripts/check_frontend_build.py

      - name: Test
        run: npx vitest run --coverage

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npx playwright test

  # The dev panels (devweb/): the second, smaller app, served by `python -m
  # devweb`. It ships in nothing, so there is no committed-build row — what has
  # to hold is that it compiles and its views work, and these lanes are the only
  # off-box thing that would notice them rotting. Same shape as the viewer's
  # job: types, component behavior, then real-browser coverage on its own
  # preview port, mocked at the network boundary (the bench's real run ledger
  # is never read).
  devweb:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devweb/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: devweb/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run e2e

  # The release lane: build the wheel + sdist, prove their contents, install the
  # wheel into a clean venv, and run the real CLI lifecycle from it. Slow enough
  # to be deselected from the default pytest run (pyproject addopts), so it's its
  # own job. Both platforms: this is the install a user actually performs, and the
  # wheel being pure Python doesn't make the venv, the console scripts, or the
  # first-run CLI lifecycle platform-free.
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Package
        run: >
          pytest -q --tb=short -p no:cacheprovider
          -m package --no-cov tests/test_package_artifact.py

  # The from-nothing install proof (tests/install/): clean-container pip
  # install, the full unit suite in isolation, then import-every-provider →
  # reindex → search e2e. Locally it is commit-triggered (the ci.toml row);
  # here it runs on exactly the PRs that ship — every PR to main is a release
  # PR — because it is far too slow for every dev push and exactly right as a
  # pre-ship gate. The runner's docker daemon is already up, so the script's
  # colima fallback never fires.
  install:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: From-nothing install proof
        run: tests/install/run_install_test.sh
