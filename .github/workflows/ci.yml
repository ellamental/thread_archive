# The public CI gate on GitHub. Mirrors the documented quality bar (README →
# "confirm green") for anyone without the local thread-ci: ruff + mypy + the
# pytest suite with its coverage floor, plus the frontend typecheck/tests and the
# wheel/sdist release lane.
#
# The one ci.toml row deliberately absent is retrieval-gate: it scores search
# quality against THIS machine's live ~/.thread/archive, which no runner has. It
# stays a local/thread-ci gate.
#
# The suite is model-free (conftest forces the embed/rerank availability gates
# off), so CI installs only the base + [dev] deps — never the heavy [embeddings]
# (torch) extra.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Python bar: ruff + mypy + the pytest suite with its coverage floor, on
  # the interpreter this project runs (3.14) — the single version pyproject
  # declares (requires-python >=3.14), so the gate tests what we actually use.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # The suite's curated-data-plane tests seed through thread-librarian's
      # write surface (they importorskip without it, which drops real coverage
      # of archive's own read paths below the floors). It lives in a private
      # sibling repo, reachable read-only via a deploy key; --no-deps because
      # its thread-archive dependency is the checkout just installed above.
      - name: Install thread-librarian (private sibling)
        env:
          LIBRARIAN_SSH_KEY: ${{ secrets.LIBRARIAN_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$LIBRARIAN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          pip install --no-deps "thread-librarian @ git+ssh://git@github.com/ellamental/thread_archive_librarian.git"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      # Coverage floor feeds the coverage-gate step; the term report keeps blind
      # spots visible in the row output.
      - name: Pytest
        run: >
          pytest -q --tb=short -p no:cacheprovider
          --cov=src --cov-branch
          --cov-report=term --cov-report=json:coverage.json

      - name: Coverage floors
        run: python scripts/coverage_gate.py coverage.json

  # The web viewer's gates. tsc --noEmit (not a build — the SPA ships pre-built
  # into the committed _web/static) plus the Vitest component suite with its
  # coverage floor.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run --coverage

  # The release lane: build the wheel + sdist, prove their contents, install the
  # wheel into a clean venv, and run the real CLI lifecycle from it. Slow enough
  # to be deselected from the default pytest run (pyproject addopts), so it's its
  # own job.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Package
        run: >
          pytest -q --tb=short -p no:cacheprovider
          -m package --no-cov tests/test_package_artifact.py
