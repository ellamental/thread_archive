# PyPI publish. The normal path is a workflow_call from release.yml, which
# runs after it tags the release merge on main (docs/releasing.md §5). The
# tag-push trigger serves the manual path — a hand-pushed release tag — and
# only that: tags created by release.yml use the default GITHUB_TOKEN, whose
# events never fire other workflows, so the two triggers cannot double-publish.
#
# Auth is PyPI Trusted Publishing (OIDC): PyPI trusts this repo + workflow +
# environment tuple directly, so no API token exists to leak or rotate. The
# `pypi` environment is part of that trust anchor — PyPI verifies it, so it
# must exist in the repo settings and match the publisher config on PyPI.
#
# Build and publish are separate jobs on purpose: the publish job holds the
# OIDC `id-token: write` grant, so nothing that builds or runs project code
# runs inside it — the artifacts cross over as a passed artifact, nothing else.

name: Publish

on:
  push:
    tags: ["v*"]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build

      # The deep artifact checks (contents, clean-venv install, real entry
      # points) are the `package` lane in CI, which has already run on the
      # release commit by the time the tag lands (preflight requires it).
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
