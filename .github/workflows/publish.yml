# PyPI publish, driven by the release tag. release.yml pushes the tag once a
# release PR merges on main (docs/releasing.md §5) — its deploy-key push fires
# this trigger like any other tag push — and a hand-pushed tag is the manual
# path. One trigger, one publish path, either way.
#
# Auth is PyPI Trusted Publishing (OIDC): PyPI trusts this repo + workflow +
# environment tuple directly, so no API token exists to leak or rotate. The
# `pypi` environment is part of that trust anchor — PyPI verifies it, so it
# must exist in the repo settings and match the publisher config on PyPI.
#
# Build and publish are separate jobs on purpose: the publish job holds the
# OIDC `id-token: write` grant, so nothing that builds or runs project code
# runs inside it — the artifacts cross over as a passed artifact, nothing else.

name: Publish

on:
  push:
    tags: ["v*"]

# Default the token to read-only; the publish job's own permissions block
# (id-token: write) replaces this wholesale for that job.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Every action here is pinned by SHA: this workflow holds the OIDC grant
      # that PyPI trusts, and a moving tag inside it is a supply chain the §0
      # hardening otherwise leaves open. Dependabot keeps the pins fresh
      # (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build

      # The tag names the release, but hatch reads `__version__` — the wheel
      # carries whatever the tagged commit's source says. If they disagree,
      # the upload publishes a version nobody tagged; worst case an rc tag on
      # a commit still carrying the final version string burns that final
      # number on PyPI (which never accepts a version twice). Fail here.
      - name: Dist version must match the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          ls dist/
          test -f "dist/thread_archive-$v-py3-none-any.whl"
          test -f "dist/thread_archive-$v.tar.gz"

      # The deep artifact checks (contents, clean-venv install, real entry
      # points) are the `package` lane in CI, which has already run on the
      # release commit by the time the tag lands (preflight requires it).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  # Proves the *published* artifact, not the built one: install the version
  # PyPI now serves into a fresh interpreter, the way an operator would, run the
  # real entry points, then drive a full ingest lifecycle on it. The package
  # lane proves a locally built wheel against locally resolved dependencies;
  # what reaches an operator is this artifact under a resolve done fresh from
  # the index, and this job is the only automated thing that touches it. Entry
  # points alone would not notice a resolve that installs cleanly and then
  # cannot import a provider or answer a query. It runs for rc and final tags
  # alike; a green run on the rc is the license to proceed toward the final
  # (docs/releasing.md). It cannot gate the upload — that already happened —
  # so a failure here means yank and ship the next version.
  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The index can lag the upload by a minute or two; retry, and insist on
      # the wheel (--only-binary) because that is what self-update installs.
      - name: Install the published version from PyPI
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 20); do
            pip install --no-cache-dir --only-binary thread-archive \
              "thread-archive==$v" && exit 0
            echo "attempt $i: $v not installable yet; retrying in 30s"
            sleep 30
          done
          exit 1

      - name: Smoke-test the installed package
        run: |
          v="${GITHUB_REF_NAME#v}"
          thread-archive --help
          archive-mcp --help
          installed=$(python -c "import thread_archive; print(thread_archive.__version__)")
          if [ "$installed" != "$v" ]; then
            echo "installed version $installed does not match tag $v"
            exit 1
          fi

      # The lifecycle harness (tests/install/) travels in no wheel, so it comes
      # from the tagged tree — the harness only; the code under test stays the
      # wheel PyPI just served, which the guard below holds mechanically. The
      # checkout is safe in this job: it inherits the workflow's read-only
      # token, and the OIDC grant lives in `publish` alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This job is worth having only if the package it exercises is the
      # published one, and that rests on the src/ layout making a shadowing
      # import impossible — a property of the tree, not a thing anything checks.
      # Check it, so a future layout change fails here instead of quietly
      # turning the lane into a second test of the checkout.
      - name: The package under test is the installed wheel
        run: |
          python - <<'PY'
          import pathlib, sys, sysconfig
          import thread_archive
          pkg = pathlib.Path(thread_archive.__file__).resolve()
          site = pathlib.Path(sysconfig.get_paths()["purelib"]).resolve()
          if site not in pkg.parents:
              sys.exit(f"thread_archive resolves to {pkg}, not the installed wheel under {site}")
          print(f"under test: {pkg}")
          PY

      # The real lifecycle on the published artifact: a corpus for every
      # provider, imported through each provider's own importer, the index
      # rebuilt from the JSONL truth, and every provider's marker searched back
      # out. Seconds, and the only place the published wheel does real work
      # against dependencies resolved fresh from the index — the `package` lane
      # and the Docker install lane both prove a locally built wheel against
      # locally resolved ones, which is a different artifact and a different
      # resolve. Base install only: the check imports nothing outside the
      # stdlib and thread_archive itself.
      - name: Real ingest lifecycle on the published wheel
        run: python tests/install/e2e_check.py
