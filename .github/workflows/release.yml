# Turns a release merge into the release tag. Merging the release PR
# (docs/releasing.md §4) is the ship; this workflow is the follow-through:
# on every push to main it reads `__version__`, and if that version's tag
# doesn't exist yet, creates the annotated tag on the pushed commit
# (message: the version's CHANGELOG section) and pushes it.
#
# The push authenticates with a write deploy key (RELEASE_TAG_DEPLOY_KEY
# secret) rather than GITHUB_TOKEN, for two reasons that share one root —
# GitHub treats token-minted refs specially: a GITHUB_TOKEN tag can't clear
# the `v*` tag ruleset on a personal repo (the Actions app can't be a bypass
# actor there; the deploy key is), and it wouldn't fire other workflows. The
# deploy-key push does both: the tag lands, and its push event triggers
# publish.yml exactly as a hand-pushed tag would — one publish path, no
# double-fire.

name: Release

on:
  push:
    branches: [main]

# The tag push authenticates with the deploy key, not GITHUB_TOKEN, so the
# token itself only ever reads the repo.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      # Pinned by SHA, like every action in the workflows that hold release
      # credentials: a moving tag in the path of the deploy key is a supply
      # chain the §0 hardening otherwise leaves open. Dependabot keeps the pins
      # fresh (.github/dependabot.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Anchored to a plain X.Y.Z, and it fails rather than tags something else.
      # Deliberately excludes pre-release strings: release candidates are
      # tagged by hand from the release branch (docs/releasing.md, "Release
      # candidates") and never reach main — an rc version string arriving
      # here means the release commit forgot the final bump, and the loud
      # failure is the guard.
      # Whatever this prints reaches a shell in the job below, which holds the
      # deploy key — so the read is the place to establish that the value cannot
      # carry a newline or a shell metacharacter, not a thing to check later.
      - name: Read version
        id: version
        run: |
          v=$(python3 -c "
          import re, pathlib, sys
          text = pathlib.Path('src/thread_archive/__init__.py').read_text()
          m = re.search(r'^__version__ = \"(\d+\.\d+\.\d+)\"\$', text, re.M)
          if not m:
              sys.exit('__version__ must be a plain X.Y.Z release string')
          print(m.group(1))
          ")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Values reach the shell as environment variables, never as `${{ }}`
      # spliced into the script text: an expression is substituted before bash
      # ever parses the line, so a value that carried shell syntax would *be*
      # shell here rather than an argument to it.
      - name: Create and push tag if absent
        env:
          DEPLOY_KEY: ${{ secrets.RELEASE_TAG_DEPLOY_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          tag="v$VERSION"
          # An existing tag is fine only when it points at this very commit —
          # that is a workflow re-run, and idempotence is what lets one be
          # re-run safely. Pointing anywhere else means a merge landed on main
          # without a version bump: the release would otherwise ship nothing
          # under an all-green Actions page, so fail loudly instead.
          existing=$(git ls-remote origin "refs/tags/$tag^{}" | cut -f1)
          if [ -z "$existing" ]; then
            existing=$(git ls-remote origin "refs/tags/$tag" | cut -f1)
          fi
          if [ -n "$existing" ]; then
            if [ "$existing" = "$GITHUB_SHA" ]; then
              echo "Tag $tag already points at this commit; nothing to do."
              exit 0
            fi
            echo "Tag $tag already exists at $existing but this push is $GITHUB_SHA —" \
                 "a release merge landed without a version bump." >&2
            exit 1
          fi
          # Tag message: subject line + that version's CHANGELOG section,
          # verbatim. A missing section fails the release loudly — the tag
          # must carry the changelog, and its absence means the release
          # commit skipped the compression step.
          python3 - "$VERSION" > tag-message.txt <<'PY'
          import re, pathlib, sys
          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text()
          m = re.search(
              rf"^## {re.escape(version)}[^\n]*\n(.*?)(?=^## |\Z)",
              text, re.M | re.S,
          )
          if not m:
              sys.exit(f"CHANGELOG.md has no '## {version}' section")
          print(f"thread-archive {version}\n")
          print(m.group(1).strip())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -F tag-message.txt "$GITHUB_SHA"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/release_key"
          chmod 600 "$HOME/.ssh/release_key"
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/release_key -o StrictHostKeyChecking=accept-new" \
            git push "git@github.com:$REPOSITORY.git" "$tag"
