# thread-archive's CI suite manifest — consumed by the maintainer's local
# commit-triggered CI sweeper (thread-ci). Nothing in the package reads it;
# without that tool it is inert documentation of the full local quality bar.
# {repo} = this repo root, {home} = the user's home.
#
# Gates the documented quality bar (docs/public/install.md → "confirm green"): ruff + the pytest
# suite from the repo's own venv, and a typecheck of the frontend. Fast gates
# first so failures surface early.

[ci]
nice = 10
default_timeout = 900
# npx (frontend-typecheck) resolves off the fnm default-alias dir — a stable
# symlink, so a node upgrade never breaks the row's path.
path_prepend = ["{repo}/.venv/bin", "{home}/.local/share/fnm/aliases/default/bin"]

# The family lint bar (config in pyproject [tool.ruff]; ruff is in the dev
# dependency group). Memory-of-record code shouldn't be the least statically
# checked in the family.
[[suite]]
name = "ruff"
argv = ["{repo}/.venv/bin/ruff", "check", "."]

# The Python type gate (config in pyproject [tool.mypy]) — the same bar the
# frontend already has via tsc. The complete package is checked, including
# import parsers, operator scripts, and truth-store durability code.
[[suite]]
name = "mypy"
argv = ["{repo}/.venv/bin/mypy"]

# Frontend type gate. npx is which-gated, so a host without node records error,
# never a silent green.
[[suite]]
name = "frontend-typecheck"
argv = ["npx", "tsc", "--noEmit"]
cwd = "frontend"

# The SPA ships as a committed build. Build into a throwaway directory and
# compare bytes so source changes can never ship the previous bundle. The
# checker deliberately leaves the committed static directory untouched.
[[suite]]
name = "frontend-build"
argv = ["{repo}/.venv/bin/python", "{repo}/scripts/check_frontend_build.py"]

# Component behavior (Vitest + Testing Library over jsdom): block rendering,
# loading/error/empty states, search grouping, uuid→thread redirects. Network is
# faked at the MSW seam with `onUnhandledRequest: 'error'`, so an unmocked fetch
# fails the row rather than passing quietly. Same which-gated npx as the
# typecheck row. --coverage so the lines floor in frontend/vite.config.ts gates
# here (the frontend analog of the coverage-gate row below); a plain local
# `vitest run` stays fast and ungated.
[[suite]]
name = "frontend-test"
argv = ["npx", "vitest", "run", "--coverage"]
cwd = "frontend"

# ── the dev panels (devweb/) ────────────────────────────────────────────────
# A second, smaller app: the retrieval report, telemetry and the search lab,
# served by `python -m devweb` on :8789. It ships in nothing — no wheel, no
# sdist — so unlike the viewer there is no committed-bundle row to compare bytes
# against. What still has to hold is that it compiles and its views work, since
# nothing else would notice them rotting.
[[suite]]
name = "devweb-typecheck"
argv = ["npx", "tsc", "--noEmit"]
cwd = "devweb/frontend"

[[suite]]
name = "devweb-test"
argv = ["npx", "vitest", "run"]
cwd = "devweb/frontend"

# Real-browser coverage for the panels, on its own preview port (4175) so it can
# run beside the viewer's lane. Same mocked-at-the-network-boundary shape: the
# bench's real run ledger is never read.
[[suite]]
name = "devweb-e2e"
argv = ["npm", "run", "e2e"]
cwd = "devweb/frontend"
timeout = 600

[[suite]]
name = "pytest"
# Branch coverage rides every sweep: the term report keeps blind spots visible in
# the row output, and the JSON report feeds the coverage-gate row below.
#
# -n 6 matches the EFFICIENCY-core count, not the performance-core one: the sweeper
# runs every suite in the OS background tier (`taskpolicy -b` on Apple Silicon), so
# the workers never land on a P-core and sizing to those oversubscribes the cores
# they actually get. Measured on this box, whole suite under that tier: 175s at -n 4,
# 158s at -n 6, 183s at -n 8. --dist=loadfile keeps a file's
# tests together on one worker: the
# suite's isolation is per-test (conftest's _isolate_archive resets the global
# engine and truth handles around each), but a file's tests still share the
# module-level fixtures they were written against, and loadfile preserves that
# without forcing a serial run. Coverage is a union over the workers' data files,
# so the floors below gate the same numbers a serial run produces.
#
# --durations surfaces the slowest tests in the row's own log, which is the only
# place a per-test slowdown is visible: loadfile pins a file to one worker, so a
# file that grows expensive setup lengthens the whole sweep's critical path while
# every row still reads green.
argv = ["{repo}/.venv/bin/pytest", "-q", "--tb=short", "-p", "no:cacheprovider",
        "-n", "6", "--dist=loadfile", "--durations=15",
        "--cov=src", "--cov-branch", "--cov-report=term", "--cov-report=json:coverage.json"]
# cwd omitted = repo root, so it resolves testpaths=["tests"] from pyproject.
timeout = 1800

# The same suite in one process, and the only row that can see cross-file state
# leaks. `--dist=loadfile` puts each file on some worker, so a global one file
# leaves dirty is only ever read by another file that happens to land beside it —
# six workers make that a coin flip, and the row above wins the flip most days.
# Serial is the worst case made deterministic: every file, one process, in
# collection order.
#
# It is not redundant with the parallel row and does not replace it. The parallel
# row is the fast gate and the one that measures coverage; this one costs its own
# ~4 minutes to answer a question no other row asks. A leak it catches is a real
# failure of a real `-n 0` run — pyproject documents that as the interactive
# escape hatch for --pdb/-s, and it is also what `-n auto` resolves to on a
# one-core box, which is how the Docker install lane can red on a machine nobody
# was looking at.
[[suite]]
name = "pytest-serial"
argv = ["{repo}/.venv/bin/pytest", "-q", "--tb=short", "-p", "no:cacheprovider",
        "-n", "0", "--no-cov"]
timeout = 1800

# Per-package coverage floors (a regression ratchet, not a target — floors and
# rationale live in the script). Reads the JSON the pytest row just wrote, so it
# must stay ordered after that row.
[[suite]]
name = "coverage-gate"
argv = ["{repo}/.venv/bin/python", "{repo}/scripts/coverage_gate.py", "{repo}/coverage.json"]

# The benchmark corpora are the bytes they were accepted on. Content hashes of
# the files each harness reads (search_lab/dataset-pins.json) — none of the
# upstreams offer an immutable handle, so a re-download or a re-clone is where a
# corpus silently becomes a different one and every recorded number quietly stops
# meaning what it did. Milliseconds: per-file digests are memoized on
# (size, mtime_ns), so the ~1GB is read once and re-read only where it changed.
#
# A corpus absent from this box, or present but not yet pinned, passes — that is
# a fact about the box. Only drift against an accepted pin reds the row.
[[suite]]
name = "dataset-pins"
argv = ["{repo}/.venv/bin/python", "-m", "search_lab", "pins"]

# Retrieval-arm liveness: asserts the model arm of the search stack loads.
# Runs against THIS machine's live archive — read-only, and thread-ci runs
# where the archive lives. --require-semantic asserts the embeddings arm
# loads (a dead model silently degrades fused search to lexical — a direct
# check catches it with zero queries).
#
# Deliberately NO metric run rides this row, and none is coming. A quality number
# over labels this archive produced is an optimistic bound on itself — the labels
# describe what the incumbent ranker already reaches — and it would wear the shape
# of a score anyway. The quality claim lives on the public benchmarks
# (`python -m search_lab benchmark`), run deliberately; see
# search_lab/README.md → "What a number here is worth".
[[suite]]
name = "retrieval-gate"
argv = ["{repo}/.venv/bin/python", "{repo}/search_lab/retrieval_eval.py",
        "--probes-only", "--require-semantic"]
timeout = 600

# Speed is deliberately NOT gated here: any latency check runs against the live,
# growing archive, so its verdict is not repeatable — growth and a code slowdown
# look identical to it. Latency is watched through the retrieval usage telemetry
# (retrieval-usage.jsonl, retrieval_report.py) and measured deliberately with
# latency_replay.py when evaluating a change. The Bench workflow's perf-trend
# artifact (search_lab/perf_trend.py) tracks the frozen-corpus gate's wall clock
# across CI runs — also non-gating, until its series characterizes the runner
# variance a band would have to clear.

# The release lane: build the wheel + sdist, prove their contents, install the
# wheel into a clean venv, and run the real CLI lifecycle from it. Deselected
# from the default pytest run (see pyproject addopts), so it gets its own row.
[[suite]]
name = "package"
argv = ["{repo}/.venv/bin/pytest", "-q", "--tb=short", "-p", "no:cacheprovider",
        "-m", "package", "--no-cov", "tests/test_package_artifact.py"]
timeout = 1200

# Real-browser smoke and interaction coverage over the production frontend
# bundle. API calls are mocked at Chromium's network boundary, so the lane is
# deterministic and never reads the operator's live archive.
[[suite]]
name = "frontend-e2e"
argv = ["npm", "run", "e2e"]
cwd = "frontend"
timeout = 600

# The from-nothing install proof (tests/install/): clean-container pip install,
# the full unit suite in isolation, then import-every-provider → reindex →
# search e2e. It lives here — commit-triggered — because the proof is
# invalidated by tree changes, not by wall-clock; this repo's own post-commit
# hook scopes it to exactly the commits that can break it. The script finds a
# docker daemon itself (starting colima headlessly when none is up), so the row
# needs no Docker Desktop. Slowest row in the manifest, so it runs last; the
# timeout covers a cold colima VM plus an uncached image build.
[[suite]]
name = "install"
argv = ["{repo}/tests/install/run_install_test.sh"]
timeout = 2700
