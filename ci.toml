# thread-archive's CI suite manifest — consumed by thread-ci
# (~/dev/thread/ops/ci). Runs land in the same ~/.thread/ci store and the same
# read surfaces as the monorepo's. {repo} = this repo root, {home} = the user's
# home.
#
# Gates the documented quality bar (README → "confirm green"): ruff + the pytest
# suite from the repo's own venv, and a typecheck of the frontend. Fast gates
# first so failures surface early, matching the monorepo ci.toml's ordering.

[ci]
nice = 10
default_timeout = 900
# npx (frontend-typecheck) resolves off the fnm default-alias dir — a stable
# symlink, same reasoning as the monorepo ci.toml's path_prepend.
path_prepend = ["{repo}/.venv/bin", "{home}/.local/share/fnm/aliases/default/bin"]

# The family lint bar (config in pyproject [tool.ruff]; ruff is in the dev
# dependency group). Memory-of-record code shouldn't be the least statically
# checked in the family.
[[suite]]
name = "ruff"
argv = ["{repo}/.venv/bin/ruff", "check", "."]

# The Python type gate (config in pyproject [tool.mypy]) — the same bar the
# frontend already has via tsc. The complete package is checked, including
# import parsers, operator scripts, and truth-store durability code.
[[suite]]
name = "mypy"
argv = ["{repo}/.venv/bin/mypy"]

# Frontend type gate. npx is which-gated, so a host without node records error,
# never a silent green.
[[suite]]
name = "frontend-typecheck"
argv = ["npx", "tsc", "--noEmit"]
cwd = "frontend"

# The SPA ships as a committed build. Build into a throwaway directory and
# compare bytes so source changes can never ship the previous bundle. The
# checker deliberately leaves the committed static directory untouched.
[[suite]]
name = "frontend-build"
argv = ["{repo}/.venv/bin/python", "{repo}/scripts/check_frontend_build.py"]

# Component behavior (Vitest + Testing Library over jsdom): block rendering,
# loading/error/empty states, search grouping, uuid→thread redirects. Network is
# faked at the MSW seam with `onUnhandledRequest: 'error'`, so an unmocked fetch
# fails the row rather than passing quietly. Same which-gated npx as the
# typecheck row. --coverage so the lines floor in frontend/vite.config.ts gates
# here (the frontend analog of the coverage-gate row below); a plain local
# `vitest run` stays fast and ungated.
[[suite]]
name = "frontend-test"
argv = ["npx", "vitest", "run", "--coverage"]
cwd = "frontend"

[[suite]]
name = "pytest"
# Branch coverage rides every sweep: the term report keeps blind spots visible in
# the row output, and the JSON report feeds the coverage-gate row below.
#
# -n 4 matches the box's performance-core count (the monorepo's lab row makes the
# same call). --dist=loadfile keeps a file's tests together on one worker: the
# suite's isolation is per-test (conftest's _isolate_archive resets the global
# engine and truth handles around each), but a file's tests still share the
# module-level fixtures they were written against, and loadfile preserves that
# without forcing a serial run. Coverage is a union over the workers' data files,
# so the floors below gate the same numbers a serial run produces.
argv = ["{repo}/.venv/bin/pytest", "-q", "--tb=short", "-p", "no:cacheprovider",
        "-n", "4", "--dist=loadfile",
        "--cov=src", "--cov-branch", "--cov-report=term", "--cov-report=json:coverage.json"]
# cwd omitted = repo root, so it resolves testpaths=["tests"] from pyproject.
timeout = 1800

# Per-package coverage floors (a regression ratchet, not a target — floors and
# rationale live in the script). Reads the JSON the pytest row just wrote, so it
# must stay ordered after that row.
[[suite]]
name = "coverage-gate"
argv = ["{repo}/.venv/bin/python", "{repo}/scripts/coverage_gate.py", "{repo}/coverage.json"]

# Retrieval-quality gate: the one regression class no other row can see — a
# search that returns plausible results while quality quietly craters (the
# live-capture FTS gap sat through every green nightly). Runs against THIS
# machine's live archive — read-only, and thread-ci runs where the archive
# lives. Two checks, each aimed directly at its failure mode:
# --require-semantic asserts the embeddings arm is alive (a dead model
# silently degrades fused search to lexical — a ~0.05 MRR shift a metric
# floor detects worst, a direct check catches with zero queries), and a small
# seeded sample of real queries mined from the archive's own tool-use trail
# (--from-log: each query is one an agent actually ran; the thread it opened
# next must rank) guards against collapse. Click labels are incumbent-shaped
# — the gold is what past search surfaced and the agent picked — so this row
# is a collapse alarm, not an arbiter: losing the ability to rank known-
# relevant threads means real breakage, but a modest breach under a
# deliberately reshaped ranker may be divergence from the logged incumbent's
# shape, not regression. Floors sit far below measured values (MRR 0.283 /
# recall@10 0.413 at calibration, n=75 seed 7) so only collapse trips them.
# A breach means investigate, not revert; on a deliberate ranking redesign,
# judge the change on its merits and recalibrate. Do not ratchet these
# floors upward: the case pool increasingly comes from the current stack
# labeling its own results, and chasing the number up compounds that
# self-preference.
# --trend-out turns the gate's throwaway numbers into a time series: one JSONL
# row per sweep in ~/.thread/archive/retrieval-trend.jsonl (real usage data —
# lives in the archive home, never the repo). The floors stay the only gate;
# the ledger is for reading drift long before collapse.
[[suite]]
name = "retrieval-gate"
argv = ["{repo}/.venv/bin/python", "{repo}/scripts/retrieval_eval.py",
        "--from-log", "75", "--rerank", "off", "--require-semantic",
        "--min-mrr", "0.14", "--min-recall10", "0.20",
        "--trend-out", "~/.thread/archive/retrieval-trend.jsonl"]
timeout = 600

# The release lane: build the wheel + sdist, prove their contents, install the
# wheel into a clean venv, and run the real CLI lifecycle from it. Deselected
# from the default pytest run (see pyproject addopts), so it gets its own row.
[[suite]]
name = "package"
argv = ["{repo}/.venv/bin/pytest", "-q", "--tb=short", "-p", "no:cacheprovider",
        "-m", "package", "--no-cov", "tests/test_package_artifact.py"]
timeout = 1200

# Real-browser smoke and interaction coverage over the production frontend
# bundle. API calls are mocked at Chromium's network boundary, so the lane is
# deterministic and never reads the operator's live archive.
[[suite]]
name = "frontend-e2e"
argv = ["npm", "run", "e2e"]
cwd = "frontend"
timeout = 600
